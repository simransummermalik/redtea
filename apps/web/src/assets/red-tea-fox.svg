<svg class="play" width="100%" viewBox="0 0 680 490" role="img" xmlns="http://www.w3.org/2000/svg">
<style>
svg .head,svg .eo,svg .blush,svg .earR,svg .breath,svg .spin{transform-box:fill-box}
.head,.breath{transform-origin:50% 100%}
.eo,.blush,.spin{transform-origin:50% 50%}
.earR{transform-origin:25% 90%}
.lift{transform-origin:340px 380px}
.tail{transform-origin:436px 385px}
.es,.eh{opacity:0}
.wisp{opacity:.5}
.fall{transform:translateY(-60px)}
.play .lift{animation:lift 8s ease-in-out infinite}
.play .head{animation:head 8s ease-in-out infinite}
.play .eo{animation:eo 8s ease-in-out infinite}
.play .es{animation:es 8s ease-in-out infinite}
.play .eh{animation:eh 8s ease-in-out infinite}
.play .blush{animation:blush 8s ease-in-out infinite}
.play .stw{animation:stw 8s ease-in-out infinite}
.play .wisp{animation:wisp 2.4s ease-out infinite}
.play .earR{animation:earR 8s ease-in-out infinite}
.play .tail{animation:tail 4s ease-in-out infinite}
.play .breath{animation:breath 3.2s ease-in-out infinite}
.play .fall{animation:fall 10s linear infinite}
.play .sway{animation:sway 2.6s ease-in-out infinite alternate}
.play .spin{animation:spin 3.2s ease-in-out infinite alternate}
@keyframes lift{0%,32%{transform:translate(0,0) rotate(0deg)}45%,68%{transform:translate(0,-24px) rotate(-3deg)}80%,100%{transform:translate(0,0) rotate(0deg)}}
@keyframes head{0%,34%{transform:translateY(0) rotate(0deg)}45%{transform:translateY(8px) rotate(0deg)}51%{transform:translateY(10px) rotate(0deg)}56%{transform:translateY(8px) rotate(0deg)}61%{transform:translateY(10px) rotate(0deg)}66%{transform:translateY(8px) rotate(0deg)}79%{transform:translateY(0) rotate(0deg)}85%{transform:translateY(0) rotate(-4deg)}93%,100%{transform:translateY(0) rotate(0deg)}}
@keyframes eo{0%,13%{opacity:1;transform:scaleY(1)}14.5%{opacity:1;transform:scaleY(.1)}16%,38%{opacity:1;transform:scaleY(1)}41%,88%{opacity:0;transform:scaleY(1)}91%,100%{opacity:1;transform:scaleY(1)}}
@keyframes es{0%,38%{opacity:0}41%,72%{opacity:1}75%,100%{opacity:0}}
@keyframes eh{0%,72%{opacity:0}75%,88%{opacity:1}91%,100%{opacity:0}}
@keyframes blush{0%,40%{opacity:.5;transform:scale(1)}52%,88%{opacity:.85;transform:scale(1.2)}96%,100%{opacity:.5;transform:scale(1)}}
@keyframes stw{0%,30%{opacity:1}36%,74%{opacity:0}84%,100%{opacity:1}}
@keyframes wisp{0%{opacity:0;transform:translateY(6px)}30%{opacity:.8}100%{opacity:0;transform:translateY(-24px)}}
@keyframes earR{0%,86%{transform:rotate(0deg)}88%{transform:rotate(-10deg)}90%{transform:rotate(4deg)}92%,100%{transform:rotate(0deg)}}
@keyframes tail{0%,100%{transform:rotate(0deg)}50%{transform:rotate(2.5deg)}}
@keyframes breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.02)}}
@keyframes fall{0%{opacity:0;transform:translateY(-40px)}10%,85%{opacity:1}100%{opacity:0;transform:translateY(500px)}}
@keyframes sway{0%{transform:translateX(-22px)}100%{transform:translateX(22px)}}
@keyframes spin{0%{transform:rotate(-30deg)}100%{transform:rotate(30deg)}}
@media (prefers-reduced-motion:reduce){svg.play [class]{animation:none}}
</style>
<title>Fox sipping red tea</title><desc>A chibi fox with big glossy eyes and a teal knit scarf sits on a cream cushion with its tail wrapped around its feet, holding a white teacup of red tea in both paws and slowly sipping it.</desc>
